[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airsspy"
version = "0.1.4"
description = "A wrapper for using AIRSS with python and ase"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Bonan Zhu", email = "zhubonan@outlook.com"}
]
maintainers = [
    {name = "Bonan Zhu", email = "zhubonan@outlook.com"}
]
keywords = ["airss", "ase", "structure-searching", "materials-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "ase>=3.17",
    "castepinput>=0.1",
    "click>=8.0",
    "jobflow>=0.1",
    "maggma>=0.50",
    "numpy>=1.20",
    "pandas>=1.3.0",
    "plotly",
    "pymatgen>=2024.2.20",
    "spglib>=1.16",
    "tabulate",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest>=6.0",
    "pytest-cov",
    "ruff",
    "twine",
]
ml = [
    "torch-sim-atomistic>=0.4.0; python_version >= '3.12'",
]
mace = [
    "mace-torch>=0.3.16; python_version >= '3.12'",
    "matscipy>=1.2.0; python_version >= '3.12'",
]
symmetrix = [
    "mace-torch>=0.3.16; python_version >= '3.12'",
    "matscipy>=1.2.0; python_version >= '3.12'",
    "symmetrix>=0.0.1; python_version >= '3.12'",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.0",
    "sphinx-autodoc2>=0.5",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
    "sphinx-togglebutton>=0.3",
    "ipykernel",  # For notebook execution
]

[project.scripts]
ap = "airsspy.cli:cli"

[project.urls]
Homepage = "https://github.com/zhubonan/airsspy"
Repository = "https://github.com/zhubonan/airsspy"
Issues = "https://github.com/zhubonan/airsspy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/airsspy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["airsspy"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["e2e: end-to-end tests that run actual CASTEP/ABACUS/VASP executables"]

[tool.coverage.run]
source = ["src/airsspy"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/airsspy"]
